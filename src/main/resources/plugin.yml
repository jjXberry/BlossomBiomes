name: BlossomBiomes
version: 1.1.1
main: com.blossomsmp.biomes.BlossomBiomes
api-version: '1.21'
author: BlossomSMP
description: Places the Blossom SMP custom biomes and guards the Ancient Blossom Sanctuary.
# Must start before the worlds load, so bukkit.yml can use it as the world's biome provider.
load: STARTUP

commands:
  biome:
    description: Shows which biome you are in
  biomes:
    description: The Blossom biomes menu (staff can click to teleport)
    usage: /biomes [biome]
  blossombiomes:
    description: Staff commands for BlossomBiomes
    aliases: [bbiomes]
    usage: /blossombiomes <where|sanctuary|shrines|reload>
    permission: blossombiomes.admin

permissions:
  blossombiomes.teleport:
    description: Click a biome in /biomes (or /biomes <biome>) to teleport to the nearest one
    default: op
  blossombiomes.admin:
    description: Use /blossombiomes, and break a shrine chest by sneaking (removes it)
    default: op

    - {item: "ELYTRA 1", weight: 2}
    - {item: "TOTEM_OF_UNDYING 1", weight: 4}
    - {item: "ENCHANTED_GOLDEN_APPLE 2", weight: 3}
    - {item: "NETHERITE_INGOT 2", weight: 5}
    - {item: "NETHERITE_UPGRADE_SMITHING_TEMPLATE 2", weight: 5}
